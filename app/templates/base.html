<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Binod Bajgai{% endblock %}</title>
    <meta name="description"
          content="{% block meta_description %}Binod Bajgai's portfolio showcasing Python, Flask, AI, and modern web development projects.{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Binod Bajgai{% endblock %}">
    <meta property="og:description"
          content="{% block og_description %}Portfolio showcasing Python, Flask, AI, and modern web development projects.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.base_url }}">
    <meta property="og:image" content="{{ url_for('static', filename='images/binod.jpeg', _external=True) }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Binod Bajgai{% endblock %}">
    <meta name="twitter:description"
          content="{% block twitter_description %}Portfolio showcasing Python, Flask, AI, and modern web development projects.{% endblock %}">
    <meta name="twitter:image" content="{{ url_for('static', filename='images/binod.jpeg', _external=True) }}">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#070B1C">
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/binod.jpeg') }}">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
     
     <link rel="stylesheet"
      href="https://unpkg.com/aos@2.3.4/dist/aos.css">     
</head>
<body>
      <a class="skip-link" href="#main-content">Skip to content</a>
      <div class="scroll-progress"></div>
      <div class="mouse-glow"></div>
      <canvas id="particles"></canvas>

      <main id="main-content">
          {% block content %}{% endblock %}
      </main>
      <script src="{{ url_for('static', filename='js/main.js') }}"></script>
      <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

      <script>
      AOS.init({
          duration:900,
          once:true,
          offset:120
      });
      </script>
</body>
</html>
