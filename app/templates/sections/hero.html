<section class="hero" id="hero">

    <div class="hero-container">

        <!-- ==========================
                LEFT CONTENT
        =========================== -->

        <div class="hero-content" data-aos="fade-right">

            <h1>
                {{ portfolio.personal.name }}
            </h1>

            <h2 class="typing-text">
                <span id="typing-role" data-roles="{{ portfolio.personal.roles }}"></span>
                <span class="typing-cursor">|</span>
            </h2>

            <p class="hero-description">
                {{ portfolio.personal.description }}
            </p>

            <div class="hero-buttons">

                <a href="#projects" class="btn-primary">
                    View Projects
                </a>

                <a href="{{ cv_url }}"
                   class="btn-secondary"
                   target="_blank"
                   rel="noopener noreferrer">

                    View CV

                </a>

            </div>

            <div class="hero-social">

                <a href="{{ portfolio.personal.github }}"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="GitHub profile">

                    <i class="fa-brands fa-github"></i>

                </a>

                <a href="{{ portfolio.personal.linkedin }}"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="LinkedIn profile">

                    <i class="fa-brands fa-linkedin"></i>

                </a>

                <a href="mailto:{{ portfolio.personal.email }}"
                   aria-label="Send email">

                    <i class="fa-solid fa-envelope"></i>

                </a>

            </div>

        </div>

        <!-- ==========================
                RIGHT SIDE
        =========================== -->

        <div class="hero-image" data-aos="fade-left">

            <div class="hero-image-wrapper">

                <div class="hero-image-wrapper">

                    <div class="hero-glow"></div>
                
                    <img
                        src="{{ portfolio.personal.photo if portfolio.personal.photo and portfolio.personal.photo.startswith('http') else url_for('static', filename=portfolio.personal.photo or 'images/binod.jpeg') }}"
                        alt="{{ portfolio.personal.name }}">
                
                    <div class="orbit orbit-one">
                
                        <div class="orbit-icon python">
                            <i class="fa-brands fa-python"></i>
                        </div>
                
                        <div class="orbit-icon flask">
                            <i class="fa-solid fa-flask"></i>
                        </div>
                
                        <div class="orbit-icon js">
                            <i class="fa-brands fa-js"></i>
                        </div>
                
                        <div class="orbit-icon ai">
                            &#129302;
                        </div>
                
                        <div class="orbit-icon mysql">
                            <i class="fa-solid fa-database"></i>
                        </div>
                
                        <div class="orbit-icon git">
                            <i class="fa-brands fa-git-alt"></i>
                        </div>
                
                    </div>
                
                </div>
            
            </div>

        </div>

    </div>

    <!-- ==========================
            STATS
    =========================== -->

    <div class="hero-stats">

        <div class="stat-card">

            <h3>{{ site_settings.projects_stat }}</h3>

            <p>Projects</p>

        </div>

        <div class="stat-card">

            <h3>{{ site_settings.technologies_stat }}</h3>

            <p>Technologies</p>

        </div>

        <div class="stat-card">

            <h3>{{ site_settings.journey_stat }}</h3>

            <p>Started Journey</p>

        </div>

    </div>

</section>
