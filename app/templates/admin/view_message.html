{% extends "base.html" %}

{% block title %}
View Message
{% endblock %}

{% block content %}

<section class="admin-dashboard">

    <div class="admin-hero">

        <div class="hero-copy">

            <p class="eyebrow">Contact Message</p>
            <h1>{{ message.subject }}</h1>
            <p class="hero-subtitle">
                From {{ message.name }}.
            </p>

        </div>

        <div class="dashboard-actions">

            <a
                href="{{ url_for('admin.dashboard') }}"
                class="btn-secondary">

                Back to Inbox

            </a>

        </div>

    </div>

    <div class="messages-panel">

        <div class="message-box">

            <p>
                <strong>Email:</strong>
                {{ message.email }}
            </p>

            <p>
                <strong>Date:</strong>
                {{ message.created_at.strftime("%d %B %Y %H:%M") }}
            </p>

            <hr>

            <p>{{ message.message }}</p>

        </div>

    </div>

</section>

{% endblock %}
